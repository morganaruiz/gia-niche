    <script> // header buttom
  function showAbout() {
    document.getElementById("home").classList.remove("active");
    document.getElementById("about").classList.add("active");
  }
  function showContact() {
    document.getElementById("home").classList.remove("active");
    document.getElementById("about").classList.remove("active");
    document.getElementById("contact").classList.add("active");
  }
</script>

<script> //reveal on scroll
  function splitWords(container) {
    const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null);
    const textNodes = [];
    let node;
    while ((node = walker.nextNode())) textNodes.push(node);

    textNodes.forEach(textNode => {
      const words = textNode.textContent.split(/(\s+)/);
      const frag = document.createDocumentFragment();
      words.forEach(w => {
        if (w.trim() === '') {
          frag.appendChild(document.createTextNode(w));
        } else {
          const span = document.createElement('span');
          span.className = 'word';
          span.textContent = w;
          frag.appendChild(span);
        }
      });
      textNode.parentNode.replaceChild(frag, textNode);
    });
  }

  const introText = document.querySelector('#about .intro'); // ← antes apuntaba a todo el <p>
  splitWords(introText);
  const words = document.querySelectorAll('#about .intro .word'); // ← scope solo a .intro

  function revealOnScroll() {
    const section = document.getElementById('about');
    const rect = section.getBoundingClientRect();
    const sectionHeight = rect.height;

    const progress = Math.min(
      Math.max((window.innerHeight - rect.top) / (sectionHeight + window.innerHeight), 0),
      1
    );

    const revealCount = Math.floor(progress * words.length *2.3);

    words.forEach((word, i) => {
      word.classList.toggle('revealed', i < revealCount);
    });
  }

  window.addEventListener('scroll', revealOnScroll);
  window.addEventListener('resize', revealOnScroll);
  revealOnScroll();
</script>
