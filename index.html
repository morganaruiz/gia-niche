<!DOCTYPE html>
<html dir="ltr" lang="es">
<head> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nina</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/x-icon" href="assets/favicon_io/favicon.ico"/>
</head>

<body>
  <header class="header">
  <a class="logo" href="#">@nina</a>
  
  <nav class="menu">
    <a href="#about" onclick="showAbout('about')">About</a>
    <a href="#contact" onclick="showContact('contact')">Contact</a>
    </nav>
  </header>

  <main>
    <section id="home"class="page-section active">
      <div class="carrousel">
      <div class="group">
        <image src="assets/agua.jpg"></image>
        <image src="assets/azul.jpg"></image>
        <image src="assets/rusia.jpg"></image>
        <image src="assets/teclado.jpg"></image>
        <image src="assets/lago.jpg"></image>
        <image src="assets/angelina.jpg"></image>
      </div> 
      <div aria-hidden class="group">
        <image src="assets/agua.jpg"></image>
        <image src="assets/azul.jpg"></image>
        <image src="assets/rusia.jpg"></image>
        <image src="assets/teclado.jpg"></image>
        <image src="assets/lago.jpg"></image>
        <image src="assets/angelina.jpg"></image>
      </div> 
      </div> 
    </section>

    <section id="about" class="page-section">
    <p>
      im nina, an <span class="turquesa">audiovisual and graphic designer & illustrator</span>
      based in madrid. im passionate about <span class="turquesa">telling 
      meaningful stories</span>, drawing inspiration from films, 
      music and archives.
      i continue to strive to grow and 
      become the best version of myself in the art world.
    </p>
    </section>
  </main>
    <script>
  function showAbout() {
    document.getElementById("home").classList.remove("active");
    document.getElementById("about").classList.add("active");
  }
  function showContact() {
    document.getElementById("home").classList.remove("active");
    document.getElementById("about").classList.remove("active");
  }
</script>
</body>
</html>
